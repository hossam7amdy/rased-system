pre-commit:
  commands:
    lint:
      run: yarn biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{md,yaml}"
      run: yarn prettier --write {staged_files}
      stage_fixed: true
    test:
        run: yarn test
    typecheck:
        run: yarn typecheck