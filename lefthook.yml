pre-commit:
  commands:
    lint:
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{md,yml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    test:
      run: npm test
    typecheck:
      run: npm run typecheck
