pre-commit:
  commands:
    lint:
      run: yarn biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{md,yml}"
      run: yarn prettier --write {staged_files}
      stage_fixed: true
    test:
      run: yarn test
    typecheck:
      run: yarn typecheck

pre-push:
  commands:
    int-tests:
      # Preflight fails loud (with the docker command) if Postgres is down;
      # then run the backend integration suite. Cache is in-memory, no redis.
      run: yarn workspace backend check:db && yarn workspace backend test:int
