pre-commit:
  commands:
    lint:
      run: yarn biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    format:
      glob: "**/*.{md,yml}"
      run: yarn prettier --write {staged_files}
      stage_fixed: true
    test:
      run: | 
        yarn test
        yarn test:e2e
        yarn workspace backend test
      follow: true
    typecheck:
      run: yarn typecheck
